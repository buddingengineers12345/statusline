# statusline — packaging, pytest, and ruff configuration.
#
# Ruff SOURCE OF TRUTH: mirrors collection_template/template_python_project/pyproject.toml
# [tool.ruff] / [tool.ruff.format] / [tool.ruff.lint] (the workspace-wide Python
# standard). Ruff selects the nearest config wholesale — it does NOT merge with
# ~/.config/ruff/ruff.toml — so the standard is restated here rather than inherited.
# Only the per-file-ignores block is project-specific (see below).

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "statusline"
version = "1.0.0"
description = "Column-aligned grid statusline for Claude Code (stdin JSON -> stdout grid)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statusline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
# py310, not the template's py311: it must match requires-python (>=3.10) so
# pyupgrade never suggests 3.11-only syntax the declared floor can't run.
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
    "TC",    # flake8-type-checking
    "PGH",   # pygrep-hooks
    "PT",    # flake8-pytest-style
    "ARG",   # flake8-unused-arguments
    "D",     # pydocstyle — enforce Google-style docstrings
    "C90",   # McCabe complexity
    "PERF",  # perflint — catch performance anti-patterns
    "T20",   # flake8-print — discourage print() in non-test code
    "T10",   # flake8-debugger — no committed breakpoint()/pdb
    "N",     # pep8-naming — case conventions
    "A",     # flake8-builtins — no shadowed builtins
    "ERA",   # eradicate — no commented-out code
    "TD",    # flake8-todos — well-formed TODO/FIXME markers
    "DTZ",   # flake8-datetimez — no naive datetimes
    "ASYNC", # flake8-async — no blocking calls in async code
    "S",     # flake8-bandit — security patterns at edit time
    "TRY",   # tryceratops — exception-handling hygiene
    "G",     # flake8-logging-format — no f-string/interpolated log messages
    "PTH",   # flake8-use-pathlib — pathlib over os.path
    "FBT",   # flake8-boolean-trap — no boolean positional flags
    "PL",    # pylint — complexity limits, magic values, eq/hash pairing
    "ANN",   # flake8-annotations — typed public functions
    "TID",   # flake8-tidy-imports — banned-api / relative-import policy
    "BLE",   # flake8-blind-except — no bare broad catches
]

# Each ignore is deliberate (mirrors the template):
# E501 — line length is enforced by ruff format, not ruff check
# TRY003 — long exception messages are fine
# ANN401 — Any is allowed at integration boundaries
# TD002/TD003 — TODO author/issue-link mandates heavier than the house policy
# FBT003 — positional booleans in third-party calls are outside caller control
ignore = [
    "E501",
    "TRY003",
    "ANN401",
    "TD002",
    "TD003",
    "FBT003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test files: these linting rules are expected idioms for pytest, not production concerns:
#   S101    — assert is the standard testing idiom
#   S108    — "/tmp/demo" is a test fixture path, not real temp-file usage
#   PLR2004 — magic numbers in test comparisons are normal
#   DTZ001  — naive datetimes in test fixtures (statusline shows local time)
#   ANN201  — return type annotations optional on pytest fixtures
#   PT006   — pytest parametrize collection-literal style
#   ARG002  — unused arguments in fixtures are normal
#   RUF003  — ambiguous unicode in comments is acceptable
#   PLC0415 — import within function is acceptable for test setup
"tests/*.py" = [
    "S101",
    "S108",
    "PLR2004",
    "DTZ001",
    "ANN201",
    "PT006",
    "PT018",
    "ARG002",
    "RUF003",
    "PLC0415",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
]
